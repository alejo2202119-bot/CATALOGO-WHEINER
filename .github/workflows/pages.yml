name: Deploy catálogo a GitHub Pages

on:
  push:
    branches: ["claude/moto-repuestos-wheiner-catalog-8nu166", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
